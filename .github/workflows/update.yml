name: Collect and publish
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'config/**', 'tests/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      action:
        description: '操作（通常は update）'
        type: choice
        options: [update, add_candidate, approve_source, remove_source, approve_article, hold_article, remove_article]
        default: update
      target_url:
        description: '追加するブログURL、または対象の記事URL'
        type: string
      source_id:
        description: '承認・停止する書き手のID（config/sources.json）'
        type: string
permissions: {}
concurrency:
  group: antenna-state
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_commit: ${{ steps.save.outputs.commit }}
      release_digests: ${{ steps.release.outputs.digests }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v6
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Apply administrator request
        env:
          ADMIN_ACTION: ${{ inputs.action || 'update' }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: python scripts/admin.py
      - name: Decide whether feed collection is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          collect=true
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$PREVIOUS_SHA" "$CURRENT_SHA" | grep -Eq '^(config/|scripts/(collect|admin|eligibility|review|review_articles)\.py$)'; then
              collect=false
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Collect feeds and check collection health
        if: steps.changes.outputs.collect == 'true'
        run: |
          result=0
          python scripts/collect.py || result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            echo "::error::The collector exited unexpectedly ($result)."
            exit "$result"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("state/status.json").read_text())
          eligibility = json.loads(Path("state/eligibility.json").read_text())
          successful = report["successful_feeds"]
          total = report["total_feeds"]
          failed = [feed for feed in report["feeds"] if feed["status"] == "error"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### RSS collection\n\nSuccessful or unchanged: {successful}/{total}\n\n")
              summary.write("### Article eligibility\n\n")
              for key in ("collected_unique", "new_auto_published", "new_auto_excluded",
                          "rechecked_and_published", "retry_count", "unresolved_count",
                          "manual_exceptions", "overdue_in_retry"):
                  summary.write(f"- {key}: {eligibility[key]}\n")
              if failed:
                  summary.write("\n### Feed failures\n\n")
              for feed in failed:
                  reason = " ".join(str(feed.get("error", "unknown error")).split())
                  summary.write(f"- {feed['id']}: {reason}\n")
          if not successful:
              raise SystemExit("::error::No RSS feeds could be verified. Previous records are retained.")
          if failed:
              print(f"::warning::{len(failed)} of {total} RSS feeds failed. Existing entries were retained. See the job summary.")
          PY
      - name: Stop unexpected public article losses
        run: python scripts/check_release.py
      - name: Build metadata-only public site
        run: python scripts/build.py --public
      - name: Save cumulative records and moderation state
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          git add config state dist
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS index and moderation state'
          fi
          commit=$(git rev-parse HEAD)
          saved=false
          for attempt in {1..3}; do
            if remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f 1); then
              if [[ "$remote" == "$commit" ]]; then
                saved=true
                break
              fi
              if [[ "$remote" != "$base" ]]; then
                echo "::error::main advanced during the build. The newer work was preserved. Start a fresh run from main."
                exit 1
              fi
              if git push origin HEAD:main; then
                saved=true
                break
              fi
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          if [[ "$saved" != true ]]; then
            echo "::error::Could not save the generated release on main."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Record public files to verify
        id: release
        working-directory: dist
        run: |
          echo "artifact_name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          {
            echo 'digests<<SHA256'
            sha256sum index.html data.js data/articles.json data/authors.json data/status.json \
              app.js style.css analytics.js songs.html sitemap.xml robots.txt
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: dist
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry_deploy.outputs.page_url }}
    steps:
      - name: Check that main still matches the saved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          for attempt in {1..3}; do
            if head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'); then
              if [[ "$head" == "$RELEASE_COMMIT" ]]; then exit 0; fi
              echo "::error::The saved release is no longer the tip of main. Start a fresh run from main."
              exit 1
            fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          echo "::error::Could not verify the current tip of main."
          exit 1
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: 240000
      - name: Wait before retrying Pages
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - name: Retry GitHub Pages deployment
        if: steps.deploy.outcome == 'failure'
        id: retry_deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: 240000
      - name: Verify live site matches the release
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url || steps.retry_deploy.outputs.page_url }}
          RELEASE_DIGESTS: ${{ needs.build.outputs.release_digests }}
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          for attempt in {1..8}; do
            stale=false
            while read -r expected path; do
              if [[ -z "$path" ]]; then continue; fi
              url="${PAGE_URL%/}/$path?release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
              if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$url" -o "$response" &&
                [[ $(sha256sum "$response" | cut -d ' ' -f 1) == "$expected" ]]; then
                continue
              fi
              echo "Live response not yet verified for $path (attempt $attempt)"
              stale=true
              break
            done <<< "$RELEASE_DIGESTS"
            if [[ "$stale" == false && -n "$RELEASE_DIGESTS" ]]; then
              echo "Verified live homepage, article data, author data, frontend assets and SEO files."
              exit 0
            fi
            if [[ "$attempt" != 8 ]]; then sleep 10; fi
          done
          echo "::error::The public site did not serve the files generated by this run."
          exit 1
