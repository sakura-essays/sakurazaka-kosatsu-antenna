name: Collect and publish
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'config/**', 'tests/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      action:
        description: '操作（通常は update）'
        type: choice
        options: [update, add_candidate, approve_source, remove_source, approve_article, hold_article, remove_article]
        default: update
      target_url:
        description: '追加するブログURL、または対象の記事URL'
        type: string
      source_id:
        description: '承認・停止する書き手のID（config/sources.json）'
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: antenna-state
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Apply administrator request
        env:
          ADMIN_ACTION: ${{ inputs.action || 'update' }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: python scripts/admin.py
      - name: Decide whether feed collection is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          collect=true
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$PREVIOUS_SHA" "$CURRENT_SHA" | rg -q '^(config/|scripts/(collect|admin|review_articles)\.py$)'; then
              collect=false
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Collect feeds (retain old records on failure)
        id: collect
        if: steps.changes.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/collect.py
      - name: Stop unexpected public article losses
        run: python scripts/check_release.py
      - name: Build metadata-only public site
        run: python scripts/build.py --public
      - name: Save cumulative records and moderation state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config state dist
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS index and moderation state'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Report feed failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::一部またはすべてのRSS取得に失敗しました。state/status.jsonを確認してください。取得済み記事と取得状態は公開済みです。'
          exit 1
