name: Collect and publish
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'config/**', 'tests/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      action:
        description: '操作（通常は update）'
        type: choice
        options: [update, add_candidate, approve_source, remove_source, approve_article, hold_article, remove_article]
        default: update
      target_url:
        description: '追加するブログURL、または対象の記事URL'
        type: string
      source_id:
        description: '承認・停止する書き手のID（config/sources.json）'
        type: string
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: antenna-state
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Apply administrator request
        env:
          ADMIN_ACTION: ${{ inputs.action || 'update' }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: python scripts/admin.py
      - name: Decide whether feed collection is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          collect=true
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$PREVIOUS_SHA" "$CURRENT_SHA" | grep -Eq '^(config/|scripts/(collect|admin|review|review_articles)\.py$)'; then
              collect=false
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Collect feeds (retain old records on failure)
        id: collect
        if: steps.changes.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/collect.py
      - name: Stop unexpected public article losses
        run: python scripts/check_release.py
      - name: Build metadata-only public site
        run: python scripts/build.py --public
      - name: Save cumulative records and moderation state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config state dist
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS index and moderation state'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: dist
          retention-days: 1
      # deploy-pages' internal artifact listing can return zero despite a
      # successful upload. Use the upload's exact ID and the Pages REST API.
      - name: Deploy GitHub Pages by uploaded artifact ID
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pages artifact upload did not return a valid ID"
            exit 1
          fi
          visible=false
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq ".artifacts[] | select(.expired == false and .id == $ARTIFACT_ID) | .id" | grep -Fxq "$ARTIFACT_ID"; then
              visible=true
              break
            fi
            sleep 5
          done
          if [[ "$visible" != true ]]; then
            echo "::error::Uploaded Pages artifact is not visible in this workflow run"
            exit 1
          fi
          oidc_token=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$oidc_token"
          deployment=$(jq -n --argjson artifact_id "$ARTIFACT_ID" \
            --arg pages_build_version "$GITHUB_SHA" --arg oidc_token "$oidc_token" \
            '{artifact_id:$artifact_id,pages_build_version:$pages_build_version,oidc_token:$oidc_token}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input -)
          unset oidc_token
          deployment_id=$(jq -er '(.id // (.status_url | split("/") | last)) | tostring | select(length > 0)' <<< "$deployment")
          page_url=$(jq -er '.page_url | select(type == "string" and length > 0)' <<< "$deployment")
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id"
          trap 'gh api --method POST "$endpoint/cancel" >/dev/null 2>&1 || true; exit 1' INT TERM
          deadline=$((SECONDS + 480))
          while (( SECONDS < deadline )); do
            if status=$(gh api "$endpoint" --jq '.status'); then
              echo "Pages deployment status: $status"
              case "$status" in
                succeed)
                  echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  echo "::error::Pages deployment ended with $status"
                  exit 1
                  ;;
              esac
            else
              echo "::warning::Pages status temporarily unavailable; retrying"
            fi
            sleep 10
          done
          gh api --method POST "$endpoint/cancel" >/dev/null 2>&1 || true
          echo "::error::Pages deployment did not finish within 8 minutes"
          exit 1
      - name: Report feed failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::一部またはすべてのRSS取得に失敗しました。state/status.jsonを確認してください。取得済み記事と取得状態は公開済みです。'
          exit 1
